name: Pages

on:
  push:
    branches: [main]
    paths:
      - "weeks/**/slides.md"
      - "weeks/**/README.md"
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Marp CLI and Chromium (for PDF export)
        run: |
          # Exact versions: an unpinned install broke the build when a new
          # puppeteer was published before its puppeteer-core.
          npm install --no-save @marp-team/marp-cli@4.5.1
          npx --yes puppeteer@25.14.0 browsers install chrome
      - name: Build slides and landing page
        run: bash site/build.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
